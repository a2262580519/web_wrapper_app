name: Build Flutter Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Generate Official Android Scaffold
        run: |
          # 1. 由官方 Flutter CLI 生成最纯净标准的 Android 原生工程底座（含 Gradle Wrapper 二进制）
          flutter create . --platforms=android --org=com.example --project-name=web_wrapper_app
          
          # 2. 注入网络权限与 HTTP 明文支持
          python3 -c '
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()
          
          if "android.permission.INTERNET" not in content:
              content = content.replace(
                  "<application",
                  "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n    <application"
              )
          
          if "usesCleartextTraffic" not in content:
              content = content.replace(
                  "<application",
                  "<application\n        android:usesCleartextTraffic=\"true\""
              )
          
          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)
          print("AndroidManifest.xml successfully patched!")
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Freqtrade-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
